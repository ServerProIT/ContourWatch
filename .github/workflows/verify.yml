name: Verify Ubuntu deployment

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.11.1
          package-manager-cache: false
      - name: API, proxy, backup and Linux logic
        run: |
          node --test tests/*.test.mjs
          python3 tests/linux_test.py
          for script in deploy/*.sh; do sh -n "$script"; done
      - name: Start isolated Compose deployment
        run: |
          printf '%s\n' \
            'PUBLIC_URL=https://monitor.example.test' \
            'APP_BIND_IP=127.0.0.1' \
            "DATA_VOLUME_NAME=contourwatch-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > deploy/.env
          sh deploy/up.sh
      - name: Container, restart and backup/restore smoke tests
        env:
          CONTOUR_CONTAINER_TEST: "1"
        run: node tests/container-smoke.mjs
      - name: Diagnostics
        if: failure()
        run: |
          cd deploy
          docker compose ps
          docker compose logs --tail=100 server
      - name: Remove only this disposable CI deployment
        if: always()
        run: |
          if test -f deploy/.env; then
            cd deploy
            docker compose down -v --remove-orphans
          fi

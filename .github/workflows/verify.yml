name: Verify Ubuntu deployment

on:
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-service:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build Windows installer and run agent checks
        shell: powershell
        run: |
          & .\installer\build.ps1
          & .\dist\windows-x64\ContourAgent.exe --self-test
          if ($LASTEXITCODE) { throw 'Agent self-test failed' }
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /r:dist\windows-x64\ContourAgent.exe /r:System.ServiceProcess.dll /out:dist\windows-x64\NoConsoleRegression.exe tests\windows-no-console.cs
          if ($LASTEXITCODE) { throw 'Harness compilation failed' }
          & .\dist\windows-x64\NoConsoleRegression.exe "$env:RUNNER_TEMP\no-console-result.txt"
          if ($LASTEXITCODE) { throw 'No-console regression failed' }
          Get-Content "$env:RUNNER_TEMP\no-console-result.txt"
          & $csc /nologo /r:dist\windows-x64\ContourAgent.exe /r:System.ServiceProcess.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /out:dist\windows-x64\WindowsCollectorTests.exe tests\windows-collectors.cs
          if ($LASTEXITCODE) { throw 'Collector tests compilation failed' }
          & .\dist\windows-x64\WindowsCollectorTests.exe "$env:RUNNER_TEMP\contour-collector-tests"
          if ($LASTEXITCODE) { throw 'Collector tests failed' }
          & $csc /nologo /r:dist\windows-x64\ContourAgent.exe /r:System.ServiceProcess.dll /r:System.Web.Extensions.dll /out:dist\windows-x64\SmartUpdateTests.exe tests\windows-smart-update.cs
          if ($LASTEXITCODE) { throw 'SMART/update tests compilation failed' }
          & .\dist\windows-x64\SmartUpdateTests.exe
          if ($LASTEXITCODE) { throw 'SMART/update tests failed' }
          & $csc /nologo /r:dist\windows-x64\ContourAgent.exe /r:dist\windows-x64\ContourTray.exe /r:System.ServiceProcess.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /out:dist\windows-x64\DiagnosticsTests.exe tests\windows-diagnostics.cs
          if ($LASTEXITCODE) { throw 'Diagnostics tests compilation failed' }
          & .\dist\windows-x64\DiagnosticsTests.exe "$env:RUNNER_TEMP\contour-diagnostic-tests"
          if ($LASTEXITCODE) { throw 'Diagnostics viewer/export tests failed' }
      - name: Actual Windows service install and restart
        shell: powershell
        run: .\tests\windows-service.ps1
      - name: Actual MSI install, repair, upgrade and uninstall
        shell: pwsh
        run: .\tests\windows-msi.ps1
      - name: MSI diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Path "$env:RUNNER_TEMP\contour-msi-*.log" -ErrorAction SilentlyContinue | ForEach-Object {
            Select-String -LiteralPath $_.FullName -Pattern 'Error |Return value 3|LaunchConditions' -Context 4,8 | Select-Object -Last 15 | ForEach-Object { $_.ToString() }
          }
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - name: API, proxy, backup and Linux logic
        run: |
          node --test tests/*.test.mjs
          python3 tests/linux_test.py
          python3 tests/linux_update_test.py
          for script in deploy/*.sh; do sh -n "$script"; done
      - name: Actual systemd signed update and failed-start rollback
        # Only synthetic fixtures and an ephemeral test key.
        run: sudo --preserve-env=CI,RUNNER_TEMP python3 tests/linux-systemd-update.py
      - name: Start isolated Compose deployment
        run: |
          printf '%s\n' \
            'PUBLIC_URL=https://monitor.example.test' \
            'APP_BIND_IP=127.0.0.1' \
            "DATA_VOLUME_NAME=contourwatch-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > deploy/.env
          sh deploy/up.sh
      - name: Container, restart and backup/restore smoke tests
        env:
          CONTOUR_CONTAINER_TEST: "1"
        run: node tests/container-smoke.mjs
      - name: Diagnostics
        if: failure()
        run: |
          cd deploy
          docker compose ps
          docker compose logs --tail=100 server
      - name: Remove only this disposable CI deployment
        if: always()
        run: |
          if test -f deploy/.env; then
            cd deploy
            docker compose down -v --remove-orphans
          fi

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_KEY: ${ADMIN_KEY:?Set ADMIN_KEY in .env (32+ random characters)}
      VIEWER_KEY: ${VIEWER_KEY:?Set a separate VIEWER_KEY in .env}
    volumes:
      - contour-data:/data
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      MONITOR_HOST: ${MONITOR_HOST:-monitor.company.local}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/etc/caddy/tls:ro
      - caddy-data:/data
    depends_on:
      server:
        condition: service_healthy
volumes:
  contour-data:
  caddy-data:

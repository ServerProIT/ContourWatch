name: contourwatch

services:
  server:
    image: contourwatch:0.4.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set the external HTTPS URL in deploy/.env}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_MODE: ${SMTP_MODE:-starttls}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-}
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - contour-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  contour-data:
    name: ${DATA_VOLUME_NAME:-contourwatch-data}
